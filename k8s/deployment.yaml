apiVersion: apps/v1
kind: Deployment
metadata:
  name: depdevflow
  labels:
    app: depdevflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: depdevflow
  template:
    metadata:
      labels:
        app: depdevflow
    spec:
      # Pod-level security settings
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: depdevflow
          image: depdevflow:local
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 3000

          # Container-level security settings
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          # Writable temporary directory
          volumeMounts:
            - name: tmp
              mountPath: /tmp

          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15

          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi

      # Temporary writable storage for the container
      volumes:
        - name: tmp
          emptyDir: {}