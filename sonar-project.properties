sonar.projectKey=DepDevFlow
sonar.projectName=DepDevFlow
sonar.projectVersion=1.0
sonar.sources=src,scripts
sonar.tests=tests,test
sonar.test.inclusions=tests/**/*.js,test/**/*.js,test/**/*.json
sonar.exclusions=node_modules/**,.scannerwork/**,coverage/**,security/fixtures/**,**/*.backup
sonar.sourceEncoding=UTF-8
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300